# iOS run configuration (used when -Dplatform=ios).

# Local Appium server started with `appium`.
appium.url=http://127.0.0.1:4723

# For iOS, name + version SELECT the simulator, so both must match `xcrun simctl list devices`.
device.name=iPhone 16 Pro
platform.version=27.0

# Simulator build (.app folder, not .ipa), relative to the project root.
app.path=apps/MyDemoApp.app
