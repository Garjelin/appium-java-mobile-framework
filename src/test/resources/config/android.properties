# Android run configuration (used when -Dplatform=android, the default).

# Local Appium server started with `appium`.
appium.url=http://127.0.0.1:4723

# AVD name. For Android it is informational: UiAutomator2 uses the first device from `adb devices`.
device.name=Pixel_8_API_34

# App under test, relative to the project root.
app.path=apps/mda-2.3.0.apk

# Activity UiAutomator2 waits for after launch. The app starts with SplashActivity and quickly
# switches to MainActivity; waiting for SplashActivity itself is a race ("never started").
# Wildcard = any activity of the app counts as "launched".
app.wait.activity=com.saucelabs.mydemoapp.android.view.activities.*
